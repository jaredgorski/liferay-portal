{{- if .Values.clientExtensionConfig.localdev -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-hook-role
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - patch
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-hook-rolebinding
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: internal-hook-serviceaccount
roleRef:
  kind: Role
  name: internal-hook-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-hook-serviceaccount
  namespace: kube-system
{{- end -}}
